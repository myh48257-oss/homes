<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div id="add-back">
        <div id="add">+</div>
    </div>
    <div id="sample-back" class="project">
        <div id="type" class="types"></div>
        <div id="sample" class="samples">タイトル</div>
    </div>
    <div id="title">
        <div id="title-content">
            <h1>タイトルを入力</h1>
            <input type="text" id="titleInput" placeholder="タイトルを入力してください">
            <select id="select">
                <option value="2Dcad">2Dcad</option>
                <option value="3Dcad">3Dcad</option>
                <option value="2D物理シミュレーション">2D物理シミュレーション</option>
                <option value="3D物理シミュレーション">3D物理シミュレーション</option>
                <option value="計算サイト">計算サイト</option>
                <option value="化学実験用シミュレーション">化学実験用シミュレーション</option>
            </select>
            <button id="exit">閉じる</button>
            <button id="create">作成</button>
        </div>
    </div>
    <button id="open">ファイルを開く</button>
    <div id="debug"></div>
    <div id="version">Ver.1.0.1</div>
    <script src="home.js"></script>
</body>
</html>
